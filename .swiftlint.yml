# SwiftLint configuration for Forme.
# Run `make lint` locally; CI runs the same command and fails the build on violations.

included:
  - Forme
  - FormeTests
  - FormeUITests

excluded:
  - .build
  - DerivedData

# Rules that are off by default but worth having. Most of these catch the kind
# of thing that reads fine in review and bites later.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  # SwiftUI view bodies are legitimately deeply nested; the rule fires constantly
  # and teaches nothing.
  - multiple_closures_with_trailing_closure

  # SwiftFormat's `modifierOrder` already enforces an order, and the two tools
  # disagree about where `nonisolated` goes. SwiftFormat wins because it can fix.
  - modifier_order

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  # Short names that are clearer than their expansions: `Theme.Spacing.md`
  # reads better than `Theme.Spacing.medium` at every call site.
  excluded: [id, url, x, y, to, at, ok, xs, sm, md, lg, xl, xxl]

nesting:
  type_level: 3

# Force-unwrapping is an error in app code. Tests use `try #require` instead,
# which fails the test with a useful message rather than crashing the runner.
force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: error

custom_rules:
  no_print:
    name: "print() in app code"
    regex: '(?<![\w.])print\('
    match_kinds: [identifier]
    message: "Use Log.app / Log.auth / Log.feature instead of print()."
    severity: warning

  no_hardcoded_supabase_key:
    name: "Hardcoded Supabase credentials"
    regex: '(supabaseKey|anonKey|service_role)\s*[:=]\s*"[A-Za-z0-9._-]{20,}"'
    message: "Credentials belong in Config/Secrets.xcconfig, not in source."
    severity: error

  # These two keep the design system honest: features may only *use* the brand,
  # never define it. Scoped to Features/ so DesignSystem/ stays free to declare
  # the primitives, and errors rather than warnings because `make lint` runs
  # --strict, where a warning fails the build anyway — a rule worth having is
  # worth saying so.
  no_raw_color_in_features:
    name: "Raw colour outside the design system"
    regex: 'Color\(\s*(red|hue|white|\.sRGB|\.displayP3)|#colorLiteral'
    included: ".*/Features/.*"
    message: "Use Theme.Colors, or SemanticStatus for anything status-coloured."
    severity: error

  no_adhoc_font_in_features:
    name: "Ad-hoc font outside the design system"
    regex: '\.font\(\s*(\.|Font\.)(system|custom)\('
    included: ".*/Features/.*"
    message: "Use .formeText(_:) so the role scales and the brand stays swappable."
    severity: error

reporter: "xcode"
